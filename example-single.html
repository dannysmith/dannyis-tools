<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Example: single file &amp; nothing else</title>
    <meta name="description" content="A dummy tool that lives in one HTML file in the repo root. Counts the words you type." />
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      textarea {
        width: 100%;
        height: 10rem;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Single file example</h1>
    <textarea placeholder="Type something…"></textarea>
    <p><output>0</output> words</p>
    <script type="module">
      const textarea = document.querySelector("textarea");
      const output = document.querySelector("output");
      textarea.addEventListener("input", () => {
        output.textContent = textarea.value.trim().split(/\s+/).filter(Boolean).length;
      });
    </script>
  </body>
</html>
